services:
  - type: web
    name: m-ai
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Secretos: se rellenan en el panel de Render (no se versionan).
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      # Tu número (formato internacional sin +) para el resumen de los domingos.
      - key: MI_NUMERO_WHATSAPP
        sync: false
      # Secreto que protege /tareas/resumen-semanal frente a llamadas externas.
      - key: CRON_SECRET
        sync: false
